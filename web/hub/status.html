<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中转站 · 卫戍协议</title>
<link rel="stylesheet" href="/__panel/hub.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230c0f0e'/%3E%3Cpath fill='%234ed8af' d='M5 3h3v2h2V3h4v2h2V3h3v5l-2 2v7l2 2v2H5v-2l2-2v-7L5 8z'/%3E%3C/svg%3E">
</head>
<body>
<div class="wrap">
  <div class="panel" id="card">
    <div class="head">
      <span class="hex" aria-hidden="true"></span>
      <div style="flex:1;min-width:0">
        <div class="micro">Stronghold Protocol · Relay</div>
        <h1>中转站</h1>
      </div>
      <span class="state" id="state">连接中</span>
    </div>
    <div class="body">
      <div class="notice" id="notice"><div class="micro" style="color:var(--gold)">房主公告 · Notice</div><div id="noticetext" style="margin-top:4px"></div></div>
      <div class="notice auto" id="autonotice"><div class="micro" style="color:var(--amber)">流量提醒 · Data</div><div id="autotext" style="margin-top:4px"></div></div>

      <div class="micro" id="meta">—</div>
      <div class="tiles">
        <div class="tile"><b class="hl" id="players">—</b><span class="micro">在线玩家</span></div>
        <div class="tile"><b id="rooms">—</b><span class="micro">房间</span></div>
        <div class="tile"><b id="inmatch">—</b><span class="micro">对局中</span></div>
        <div class="tile"><b id="spect">—</b><span class="micro">观战</span></div>
      </div>

      <div class="quota" id="quota" hidden>
        <div class="quota-l"><span class="micro">Today · 今日联机流量</span><span class="num" id="qtext">—</span></div>
        <div class="qbar"><i id="qbar"></i></div>
      </div>

      <div class="micro" style="margin-bottom:10px">Rooms · 房间与成员</div>
      <div class="tbl" id="list"><div class="empty">加载中…</div></div>

      <div class="actions">
        <a class="btn" href="/play" id="enter">进入游戏</a>
        <a class="btn ghost" href="/backup">备份 / 恢复干员调配</a>
      </div>
      <div class="foot"><span class="micro" id="live" style="color:var(--mint)">连接中</span> · 不用刷新页面。房间信息由房主面板根据游戏日志实时整理；如有出入以游戏大厅为准。</div>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const up = (s) => s == null ? "" : s >= 3600 ? `${Math.floor(s / 3600)} 小时 ${Math.floor(s % 3600 / 60)} 分` : `${Math.floor(s / 60)} 分钟`;
  let base = null, baseAt = 0;   // uptime ticks locally between pushes
  function render(d) {
    $("card").classList.toggle("off", !d.online);
    $("state").textContent = d.online ? "服务器在线" : "服务器离线";
    $("state").className = "state" + (d.online ? "" : " bad");
    base = d.uptimeSec; baseAt = Date.now(); meta(d.version);
    $("players").textContent = d.players ?? "—";
    $("rooms").textContent = d.roomCount ?? "—";
    $("inmatch").textContent = d.inMatch ?? "—";
    $("spect").textContent = d.spectators ?? "—";
    $("notice").classList.toggle("show", !!d.notice);
    $("noticetext").textContent = d.notice || "";
    $("autonotice").classList.toggle("show", !!d.autoNotice);
    $("autotext").textContent = d.autoNotice || "";
    if (d.usage) {
      const g = (b) => (b / 1073741824).toFixed(2);
      $("quota").hidden = false;
      $("qtext").textContent = `${g(d.usage.usedBytes)} / ${g(d.usage.limitBytes)} GiB · ${d.usage.pct}%`;
      $("qbar").style.width = Math.min(100, d.usage.pct) + "%";
      $("quota").className = "quota" + (d.usage.pct >= 95 ? " bad" : d.usage.pct >= 80 ? " warn" : "");
    }
    $("enter").style.display = d.online ? "" : "none";
    if (!d.online) { $("list").innerHTML = '<div class="empty">游戏暂时不在线，房主可能在重启或更新。恢复后本页会立刻更新。</div>'; return; }
    $("list").innerHTML = d.rooms.length
      ? d.rooms.map((r) => {
          const n = r.members ? r.members.filter((m) => !m.bot).length : null;
          const cap = r.capacity ? `${r.members ? r.members.length : "?"}/${r.capacity}` : "";
          return `<div class="room">
            <div class="room-top"><span class="code">${esc(r.code)}</span>
              ${r.inMatch ? '<span class="tag busy">对局中</span>' : '<span class="tag open">可加入</span>'}
              <span class="dim room-mode">${esc(r.mode)}${r.difficulty ? " · " + esc(r.difficulty) : ""}${cap ? " · " + cap : ""}</span>
              ${r.inMatch ? "" : `<a class="btn sm ghost" href="/play?room=${encodeURIComponent(r.code)}">加入</a>`}</div>
            <div class="mems">${r.members ? r.members.map(mem).join("") : `<span class="mem host">${esc(r.host)}<i>房主</i></span><span class="dim" style="font-size:12px">成员下次房间变动时显示</span>`}
              ${(r.watchers || []).map((w) => `<span class="mem watch${w.online ? "" : " off"}">${esc(w.name)}<i>观战</i></span>`).join("")}</div>
          </div>`;
        }).join("")
      : '<div class="empty">当前没有房间 — 进入游戏创建一个吧</div>';
  }
  const mem = (m) => `<span class="mem${m.host ? " host" : ""}${m.bot ? " bot" : ""}${m.online ? "" : " off"}">${esc(m.name)}${m.host ? "<i>房主</i>" : ""}${m.bot ? "<i>AI</i>" : ""}${!m.online ? "<i>离线</i>" : m.ready && !m.host && !m.bot ? "<i>已准备</i>" : ""}</span>`;
  let ver = null;
  function meta(v) {
    if (v !== undefined) ver = v;
    const sec = base == null ? null : base + Math.floor((Date.now() - baseAt) / 1000);
    $("meta").textContent = [ver && "v" + String(ver).replace(/^v/, ""), sec != null && "已运行 " + up(sec)].filter(Boolean).join(" · ") || "—";
  }
  setInterval(() => meta(), 15000);

  // live push (SSE); falls back to polling if the stream can't be held open
  let poll = null;
  async function pollOnce() {
    try { render(await (await fetch("/status.json", { cache: "no-store" })).json()); $("live").textContent = "每 5 秒刷新"; }
    catch { $("state").textContent = "无法连接"; $("state").className = "state bad"; }
  }
  function startPoll() { if (!poll) { pollOnce(); poll = setInterval(pollOnce, 5000); } }
  if (window.EventSource) {
    const es = new EventSource("/__panel/events");
    es.onmessage = (ev) => { if (poll) { clearInterval(poll); poll = null; } $("live").textContent = "实时更新"; render(JSON.parse(ev.data)); };
    es.onerror = () => { $("live").textContent = "重新连接中…"; setTimeout(() => { if (es.readyState !== 1) startPoll(); }, 4000); };
  } else startPoll();
</script>
</body>
</html>
